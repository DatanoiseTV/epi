# Fast PR / branch CI: builds Epi on macOS + Linux + Windows and runs every
# measured suite. No signing, no artefacts — just the proof that main and
# proposed merges compile clean and the models still measure right.

name: ci

on:
  pull_request:
  push:
    branches: [ '**' ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A wedged runner (a hung apt mirror, a stalled action download) otherwise
    # burns the six-hour default doing nothing -- one sat in "install deps"
    # for over an hour before anyone noticed. The slowest honest leg finishes
    # in under ten minutes; thirty is generosity, not a constraint.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-22.04, ubuntu-24.04, windows-2022 ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: install linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # webkit2gtk 4.1 (libsoup-3) is mandatory everywhere we build; the
          # legacy 4.0 package only exists on 22.04 and lets JUCE also
          # runtime-dlopen the old SO for users on older distros.
          sudo apt-get update
          UBUNTU_VER=$(. /etc/os-release; echo "$VERSION_ID")
          PKGS=(libasound2-dev libjack-jackd2-dev
                libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev
                libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
                libwebkit2gtk-4.1-dev libsoup-3.0-dev
                libglu1-mesa-dev mesa-common-dev libgtk-3-dev ninja-build)
          if [[ "$UBUNTU_VER" == "22.04" ]]; then
              PKGS+=(libwebkit2gtk-4.0-dev libsoup2.4-dev)
          fi
          sudo apt-get install -y "${PKGS[@]}"

      - name: install macos deps
        if: matrix.os == 'macos-14'
        run: brew install ninja

      - name: set up msvc environment
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # JUCE's FindWebView2 does not fetch the SDK — it expects the
      # Microsoft.Web.WebView2 NuGet package on disk (NEEDS_WEBVIEW2 TRUE).
      - name: install webview2 sdk
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 \
                -OutputDirectory webview2-sdk -NonInteractive
          echo "WEBVIEW2_DIR=$(cygpath -m "$PWD/webview2-sdk")" >> "$GITHUB_ENV"

      - name: configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPLUGIN_INSTALL_LOCAL=OFF
          ${WEBVIEW2_DIR:+-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$WEBVIEW2_DIR}

      - name: build
        shell: bash
        run: |
          cmake --build build --target Epi_All Epi_CLAP \
            epi_dsp_tests epi_reference_tests epi_grand_tests epi_wurli_tests \
            epi_clavinet_tests epi_preset_tests epi_engine_tests epi_tuning_tests \
            epi_radiation_tests epi_state_tests epi_control_tests -j

      # The headless host is a Linux and macOS target; there is no Windows
      # build of it, so it is built only where it exists.
      - name: build headless host
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: cmake --build build --target EpiHeadless -j

      - name: tests
        shell: bash
        run: ctest --test-dir build --output-on-failure

      # docs/ControlMap.md is generated from the control map and the live
      # parameter layout. Checking it here is what stops the published
      # numbers and the document that publishes them from drifting apart.
      - name: control map document is current
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: ./tools/update-control-map.sh --check
