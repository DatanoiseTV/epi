# Release builds: installable macOS, Windows and Linux packages.
#
# Separate from ci.yml, which only proves the tree compiles and the suites
# pass. This one builds what a user actually downloads: a universal macOS
# binary, a Windows x64 build and a Linux x64 build of every format, zipped
# with a short install note. Runs on a version tag, or on demand from the
# Actions tab.

name: release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A wedged runner (a hung apt mirror, a stalled action download) otherwise
    # burns the six-hour default doing nothing -- one sat in "install deps"
    # for over an hour before anyone noticed. The slowest honest leg finishes
    # in under ten minutes; thirty is generosity, not a constraint.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (universal)
            package: macos
          - os: windows-2022
            label: Windows (x64)
            package: windows
          - os: ubuntu-22.04
            label: Linux (x64)
            package: linux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: install macos deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: install linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.0-dev \
            libsoup2.4-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev \
            ninja-build

      - name: set up msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # JUCE's FindWebView2 does not fetch the SDK — it expects the
      # Microsoft.Web.WebView2 NuGet package on disk (NEEDS_WEBVIEW2 TRUE).
      - name: install webview2 sdk
        if: runner.os == 'Windows'
        shell: bash
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 \
                -OutputDirectory webview2-sdk -NonInteractive
          echo "WEBVIEW2_DIR=$(cygpath -m "$PWD/webview2-sdk")" >> "$GITHUB_ENV"

      # Both architectures on macOS, so the download runs on Apple silicon and
      # Intel alike. It doubles the compile, which only matters here. The
      # architecture list is quoted: its separator is a semicolon, which an
      # unquoted shell would read as the end of the command.
      - name: configure
        shell: bash
        run: |
          ARGS=(-S . -B build -G Ninja
                -DCMAKE_BUILD_TYPE=Release
                -DPLUGIN_INSTALL_LOCAL=OFF)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          if [[ -n "${WEBVIEW2_DIR:-}" ]]; then
            ARGS+=("-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$WEBVIEW2_DIR")
          fi
          cmake "${ARGS[@]}"

      - name: build
        shell: bash
        run: |
          cmake --build build --target Epi_All Epi_CLAP \
            epi_dsp_tests epi_reference_tests epi_grand_tests epi_wurli_tests \
            epi_clavinet_tests epi_preset_tests epi_engine_tests -j

      # A release that does not play in tune is not a release.
      - name: tests
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: verify macos binary is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=build/Epi_artefacts/Release/VST3/Epi.vst3/Contents/MacOS/Epi
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64" || { echo "missing arm64 slice"; exit 1; }
          lipo -info "$BIN" | grep -q "x86_64" || { echo "missing x86_64 slice"; exit 1; }

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for PLUGIN in Epi; do
            ART="build/${PLUGIN}_artefacts/Release"
            STAGE="stage/$PLUGIN"
            mkdir -p "$STAGE"

            cp -R "$ART/VST3/$PLUGIN.vst3"          "$STAGE/"
            cp -R "$ART/CLAP/$PLUGIN.clap"          "$STAGE/"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              cp -R "$ART/AU/$PLUGIN.component"     "$STAGE/"
              cp -R "$ART/Standalone/$PLUGIN.app"   "$STAGE/"
            elif [[ "${{ runner.os }}" == "Windows" ]]; then
              cp -R "$ART/Standalone/$PLUGIN.exe"   "$STAGE/"
            else
              cp -R "$ART/Standalone/$PLUGIN"       "$STAGE/"
            fi

            cp README.md CHANGELOG.md LICENSE "$STAGE/"
            cp .github/INSTALL-${{ runner.os }}.txt "$STAGE/INSTALL.txt"

            # ditto preserves bundle structure and resource forks; plain zip
            # on macOS can mangle a .component or .app.
            LOWER=$(echo "$PLUGIN" | tr 'A-Z' 'a-z')
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              ditto -c -k --sequesterRsrc --keepParent "$STAGE" "dist/$LOWER-${{ matrix.package }}.zip"
            else
              7z a -tzip "dist/$LOWER-${{ matrix.package }}.zip" "$STAGE" > /dev/null
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Epi ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Unsigned builds. See INSTALL.txt inside the archive for how to open them on macOS and Windows."
